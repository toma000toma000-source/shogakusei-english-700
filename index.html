<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小学生 英単語700 テストゲーム</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--blue:#2563eb;--green:#166534;--red:#b91c1c;--muted:#667085}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);margin:0;color:#222}
.wrap{max-width:760px;margin:auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 8px 24px #0001;margin-bottom:12px}
h1{font-size:24px;margin:0 0 8px} h2{font-size:24px;margin:10px 0} h3{margin:14px 0 8px}
button,input,select{font:inherit} label{font-weight:700;font-size:14px}
input,select{width:100%;padding:11px;margin:5px 0 11px;border:1px solid #cfd4dc;border-radius:10px;background:white}
button{border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.primary{background:var(--blue);color:white;font-weight:700} .secondary{background:#e5e7eb;color:#111}
.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;background:#f3f4f6;border:2px solid transparent;font-weight:600}
.choice:disabled{opacity:1;color:#222} .hidden{display:none!important}
.barbox{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden} .bar{height:100%;background:var(--blue);transition:width .2s}
.small{font-size:13px;color:var(--muted)} .pill{display:inline-block;background:#eef2ff;padding:5px 9px;border-radius:999px;font-size:12px}
.big{font-size:44px;font-weight:800} .good{color:var(--green);font-weight:700} .bad{color:var(--red);font-weight:700}
.word{font-size:34px;font-weight:800;line-height:1.15;word-break:break-word;margin:12px 0}
.feedback{margin-top:10px;padding:12px;border-radius:12px;text-align:center;font-weight:700}
.nextwrap{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));padding-top:8px;background:linear-gradient(transparent,var(--card) 35%)}
#nextBtn{width:100%;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap} .row>button{flex:1 1 160px}
.speaker{background:#eef2ff;color:#1d4ed8;padding:8px 12px;margin-left:6px}
.note{background:#fff8e1;border-radius:12px;padding:10px;font-size:13px;margin-top:10px}
.badge{display:inline-block;background:#f2f4f7;padding:3px 7px;border-radius:999px;font-size:12px;margin-left:5px}
</style>
</head>
<body><div class="wrap">
<section class="card" id="start">
<h1>小学生 英単語700 テストゲーム</h1>
<p class="small">700語からランダム出題。英→日、日本語→英語、ミックスに対応。</p>
<label>名前</label><input id="name" placeholder="名前を入力">
<label>カテゴリ</label><select id="category"><option value="all">すべて（700語）</option><option value="数字・時間・曜日・月">数字・時間・曜日・月（80語）</option><option value="食べ物・飲み物">食べ物・飲み物（80語）</option><option value="動物・自然・天気">動物・自然・天気（70語）</option><option value="体・服・色・形">体・服・色・形（70語）</option><option value="学校・家・身の回り">学校・家・身の回り（80語）</option><option value="場所・建物・乗り物">場所・建物・乗り物（60語）</option><option value="家族・人・職業・国">家族・人・職業・国（70語）</option><option value="スポーツ・遊び・音楽">スポーツ・遊び・音楽（50語）</option><option value="動詞">動詞（80語）</option><option value="形容詞・副詞・あいさつ・その他">形容詞・副詞・あいさつ・その他（60語）</option></select>
<label>出題方向</label><select id="direction"><option value="mix">ミックス</option><option value="en-ja">英語 → 日本語</option><option value="ja-en">日本語 → 英語</option></select>
<label>問題数</label><select id="countMode"><option value="10">10問</option><option value="20">20問</option><option value="30">30問</option><option value="50">50問</option><option value="100">100問</option></select>
<button class="primary" style="width:100%" onclick="startQuiz()">スタート</button>
<div class="note">※ 文部科学省の「600〜700語程度」は固定の公式700語リストではなく、指導で扱う語彙量の目安です。このゲームは小学生向けの基礎語彙を700語に整理した練習用リストです。</div>
</section>

<section class="card hidden" id="quiz">
<div class="barbox"><div class="bar" id="bar"></div></div>
<p class="small" id="counter"></p>
<div><span class="pill" id="catPill"></span><span class="badge" id="dirBadge"></span></div>
<div class="word" id="prompt"></div>
<button class="speaker" id="speakerBtn" onclick="speakCurrent()">🔊 発音</button>
<div id="choices"></div>
<div id="feedback" class="feedback hidden"></div>
<div class="nextwrap"><button id="nextBtn" class="primary" onclick="nextQ()" disabled style="opacity:.5">次へ</button></div>
</section>

<section class="card hidden" id="result">
<h2>結果</h2><div class="big" id="score"></div><p id="message"></p>
<p><b>正解数：</b><span id="correct"></span></p>
<h3>間違えた単語</h3><div id="review"></div>
<div class="row"><button class="primary" onclick="retryWrong()">間違えた単語だけ再挑戦</button><button class="secondary" onclick="location.reload()">最初から</button></div>
<p class="small" id="sendStatus">終了後、成績は自動送信されます。</p>
</section>
</div>

const el=id=>document.getElementById(id);
let qs=[],idx=0,selected=null,answers=[],lastWrong=[],startedAt=null,sentForAttempt=false,currentDirection='en-ja';
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function playTone(ok){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type=ok?'sine':'square';const t=ctx.currentTime;if(ok){osc.frequency.setValueAtTime(660,t);osc.frequency.setValueAtTime(880,t+.12);osc.frequency.setValueAtTime(1175,t+.24);gain.gain.setValueAtTime(.22,t);gain.gain.exponentialRampToValueAtTime(.001,t+.45);osc.start();osc.stop(t+.45)}else{osc.frequency.setValueAtTime(220,t);osc.frequency.setValueAtTime(150,t+.18);gain.gain.setValueAtTime(.16,t);gain.gain.exponentialRampToValueAtTime(.001,t+.42);osc.start();osc.stop(t+.42)}}catch(e){}}
function speak(text){if(!('speechSynthesis' in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function speakCurrent(){if(!qs[idx])return;speak(qs[idx].en)}
function startQuiz(){const name=el('name').value.trim();if(!name){alert('名前を入力してください');return};let pool=VOCAB;const cat=el('category').value;if(cat!=='all')pool=VOCAB.filter(x=>x.cat===cat);const n=Math.min(Number(el('countMode').value),pool.length);qs=shuffle(pool).slice(0,n);idx=0;answers=[];lastWrong=[];sentForAttempt=false;startedAt=new Date();el('start').classList.add('hidden');el('result').classList.add('hidden');el('quiz').classList.remove('hidden');render()}
function makeChoices(x,dir){const key=dir==='en-ja'?'ja':'en';let candidates=VOCAB.filter(v=>v.en!==x.en && v[key]!==x[key] && v.cat===x.cat);if(candidates.length<3)candidates=VOCAB.filter(v=>v.en!==x.en && v[key]!==x[key]);const seen=new Set(),vals=[];for(const v of shuffle(candidates)){const val=v[key];if(!seen.has(val)){seen.add(val);vals.push(val)}if(vals.length===3)break}return shuffle([x[key],...vals])}
function render(){selected=null;const x=qs[idx];const mode=el('direction').value;currentDirection=mode==='mix'?(Math.random()<.5?'en-ja':'ja-en'):mode;el('counter').textContent=`第${idx+1}問 / ${qs.length}問`;el('catPill').textContent=x.cat;el('dirBadge').textContent=currentDirection==='en-ja'?'英 → 日':'日 → 英';el('prompt').textContent=currentDirection==='en-ja'?x.en:x.ja;el('speakerBtn').style.display=currentDirection==='en-ja'?'inline-block':'none';el('bar').style.width=`${idx/qs.length*100}%`;const box=el('choices');box.innerHTML='';const fb=el('feedback');fb.classList.add('hidden');fb.innerHTML='';fb.style.background='';fb.style.color='';const next=el('nextBtn');next.disabled=true;next.style.opacity='.5';const choices=makeChoices(x,currentDirection);const correct=currentDirection==='en-ja'?x.ja:x.en;choices.forEach(t=>{const b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=()=>{if(selected!==null)return;selected=t;answers[idx]=t;document.querySelectorAll('.choice').forEach(btn=>{btn.disabled=true;if(btn.textContent===correct){btn.style.background='#e8f5e9';btn.style.borderColor='#2e7d32'}if(btn.textContent===t&&t!==correct){btn.style.background='#ffebee';btn.style.borderColor='#c62828'}});const ok=t===correct;playTone(ok);speak(x.en);fb.classList.remove('hidden');fb.style.background=ok?'#e8f5e9':'#ffebee';fb.style.color=ok?'#166534':'#b91c1c';fb.innerHTML=`<div style="font-size:28px">${ok?'○ 正解！':'× 不正解'}</div><div style="margin-top:6px">${x.en} ＝ ${x.ja}</div>`;next.disabled=false;next.style.opacity='1'};box.appendChild(b)})}
function nextQ(){if(selected===null)return;idx++;if(idx<qs.length)render();else showResult()}
function showResult(){el('quiz').classList.add('hidden');el('result').classList.remove('hidden');let ok=0;lastWrong=[];qs.forEach((x,i)=>{const dirAtAnswer=answers[i]===x.ja?'en-ja':(answers[i]===x.en?'ja-en':'unknown');const isOk=answers[i]===x.ja||answers[i]===x.en;if(isOk)ok++;else lastWrong.push(x)});const s=Math.round(ok/qs.length*100);el('score').textContent=s+'点';el('correct').textContent=`${ok} / ${qs.length}`;el('message').textContent=s>=90?'すばらしい！かなり定着しています。':s>=70?'よくできました。間違えた単語をもう一度！':'間違えた単語を中心に少しずつ覚えよう。';el('review').innerHTML=lastWrong.length?lastWrong.map(w=>`<div style="padding:10px;margin:8px 0;background:#fff7f7;border-radius:10px"><b>${w.en}</b> ＝ ${w.ja} <span class="small">（${w.cat}）</span></div>`).join(''):'<p class="good">全問正解！</p>';sendResult()}
function retryWrong(){if(!lastWrong.length){alert('間違いはありません！');return}qs=shuffle(lastWrong);idx=0;answers=[];selected=null;sentForAttempt=false;startedAt=new Date();el('result').classList.add('hidden');el('quiz').classList.remove('hidden');render()}
function buildData(){let ok=0;const wrong=[];qs.forEach((x,i)=>{if(answers[i]===x.ja||answers[i]===x.en)ok++;else wrong.push(x.en)});return{studentName:el('name').value.trim(),subject:'小学生英単語700',score:Math.round(ok/qs.length*100),correct:ok,total:qs.length,wrongQuestions:wrong.join(','),weakTopics:'',startedAt:startedAt?startedAt.toISOString():'',finishedAt:new Date().toISOString()}}
async function sendResult(){const status=el('sendStatus');const ENDPOINT='https://script.google.com/macros/s/AKfycbxxBGR0zMSx34cOws9dt7la53wo9ufEnY5_J3tKoQ6u7iI7y6N3pvbc2T6N0CUv1hJl/exec';if(sentForAttempt)return;sentForAttempt=true;try{status.textContent='成績を自動送信中…';await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(buildData())});status.textContent='成績は管理者へ自動送信されました。'}catch(e){sentForAttempt=false;status.textContent='成績の自動送信に失敗しました。'}}
</script></body></html>
